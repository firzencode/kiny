[package]
name = "kiny-editor"
version = "0.14.0"
description = "Kiny desktop story editor — a Tauri 2 shell for the Ink-inspired Kiny interactive-fiction DSL"
authors = ["firzencode <firzencode@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/firzencode/kiny"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

# 仅测试用：external_control 的 body 上限判定要跑真 axum 的 to_bytes（async），验证
# 「超限时它确实返回 Err」——classify_body(None) 的整个前提就建立在这个假设上。
# 主依赖的 tokio 只开 sync/net（运行时无需 macros/rt），故 runtime 在此单独补。
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
zip = "2"
axum = "0.8"
tokio = { version = "1", features = ["sync", "net"] }
uuid = { version = "1", features = ["v4"] }

# 单实例（文件关联转发）：桌面独有——双击 .kiw 拉起时，若已运行则聚焦现窗口 + 转发新实例 argv。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# 免安装 portable 版启动期检测 WebView2 运行时（缺失则弹原生提示并干净退出）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
